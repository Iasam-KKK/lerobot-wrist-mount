# Bridge map for control:=false - the passive arm, no ros2_control.
#
# Here nothing on the ROS side publishes joint states, so Gazebo's
# JointStatePublisher is bridged instead. gz_topic_name MUST stay the default
# scoped name; overriding <topic> in the plugin breaks this silently and RViz
# then discards every camera frame with "Message Filter dropping message".

- ros_topic_name: "/wrist_cam/camera_info"
  gz_topic_name: "/wrist_cam/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

- ros_topic_name: "/joint_states"
  gz_topic_name: "/world/pick_bench/model/so101_wrist_cam/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS
